name: Build Windows Launcher

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop/launcher/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage launcher files
        run: |
          mkdir -p release/CardsOfFactoria
          cp "desktop/launcher/Cards of Factoria.vbs" release/CardsOfFactoria/
          cp "desktop/launcher/Open in Browser.url" release/CardsOfFactoria/
          cp "desktop/launcher/README.txt" release/CardsOfFactoria/

      - name: Zip release
        run: |
          cd release
          zip -r CardsOfFactoria-Windows.zip CardsOfFactoria

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardsOfFactoria-Windows
          path: release/CardsOfFactoria-Windows.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/CardsOfFactoria-Windows.zip
          generate_release_notes: true
